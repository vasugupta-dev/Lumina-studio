[build-system]
requires = ["maturin>=1.5", "setuptools>=61"]
build-backend = "maturin"

[project]
name = "rust_client"
version = "1.0.0"
description = "Rust-accelerated JSON parser and utilities for Lumina desktop (verified faster than stdlib, graceful fallback)"
requires-python = ">=3.10"

[tool.maturin]
bindings = "pyo3"
